# XcodeGen spec for the SHROUD Apple clients (iOS and macOS share one
# codebase). Generate the project with:
#
#     brew install xcodegen
#     cd clients/ios && xcodegen generate && open Shroud.xcodeproj
#
name: Shroud
options:
  bundleIdPrefix: com.shroud
  deploymentTarget:
    iOS: "16.0"
    macOS: "13.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "2.6.7"   # bumped with VERSION by release-windows.yml
    CURRENT_PROJECT_VERSION: "20607"
    DEVELOPMENT_TEAM: ""   # set your team to sign
targets:
  Shroud:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: .
        excludes:
          - "*.md"
          - "project.yml"
          - "Tests/**"
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: SHROUD
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: true
        # The relay is reached by IP with a self-signed certificate that the
        # app pins on first use (Relay.swift). ATS does not apply to raw IP
        # addresses, so no exception is needed for the default relay.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
    entitlements:
      path: Shroud.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shroud.client
        TARGETED_DEVICE_FAMILY: "1,2"
