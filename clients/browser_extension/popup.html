<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>SHROUD Share</title>
  <link rel="stylesheet" href="ui.css">
  <style>body { width: 340px; padding: 14px; }</style>
</head>
<body>
  <div class="head"><img src="icons/icon48.png" alt=""><h1>SHROUD Share</h1></div>
  <label for="contact">To</label>
  <select id="contact"></select>
  <label for="body">Message</label>
  <textarea id="body" rows="6" placeholder="Sealed on this device before it leaves the browser"></textarea>
  <button id="send" class="primary">Send</button>
  <div class="status" id="status"></div>
  <script type="module" src="popup.js"></script>
</body>
</html>
